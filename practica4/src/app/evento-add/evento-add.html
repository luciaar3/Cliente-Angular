<h1>Añade un evento</h1>
<form (ngSubmit)="guardarEvento()">
  <div class="form-group">
    <label>Nombre</label>
    <input type="text" class="form-control" [(ngModel)]="nuevoEvento.title" name="title">
  </div>

  <div class="form-group">
    <label>Fecha</label>
    <input type="date" class="form-control" [(ngModel)]="nuevoEvento.date" name="date">
  </div>

  <div class="form-group">
    <label>Descripción</label>
    <textarea class="form-control" [(ngModel)]="nuevoEvento.description" name="description"></textarea>
  </div>

  <div class="form-group">
    <label>Precio</label>
    <input type="number" class="form-control" [(ngModel)]="nuevoEvento.price" name="price" min="0" step="0.01">
  </div>

  <div class="form-group">
    <label>Imagen</label>
    <input type="file" class="form-control" (change)="changeImage($event.target)">
  </div>

  <img [src]="nuevoEvento.image" class="img-thumbnail my-2">

  <button type="submit" class="btn btn-primary mt-2">Create</button>
</form>
