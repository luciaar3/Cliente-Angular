
<div class="card">
      <img [src]="evento.image" [alt]="'Imagen del ' + evento.title" width="100%">
      <div class="card-body">
        <h4 class="card-title"  [innerText]="evento.title | titlecase"></h4>
        <p class="card-text"  [innerText]="evento.description"></p>
        <div class="text-end">
      <button class="btn btn-danger ml-3" (click)="deleteEvento()">Delete</button>
      </div>

<div class="card-footer text-muted d-flex justify-content-between">
        <span>{{ evento.date | date: 'dd-MM-yyyy'}}</span>
        <span>{{ evento.price | currency: 'EUR'}}</span>
      </div>
</div>
